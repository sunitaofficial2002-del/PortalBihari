<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bihar Portal</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="main-header">
        <div class="container" style="display: flex; align-items: center; position: relative; justify-content: center; height: 32px;">
            <button id="headerBackBtn" style="display: none; position: absolute; left: 15px; background: none; border: none; cursor: pointer; color: var(--ink); padding: 4px; align-items: center; justify-content: center;">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <a href="#" class="logo" style="text-decoration: none; pointer-events: none;">Bihar Portal</a>
        </div>
    </header>

    <main class="container">
        <!-- HOME VIEW: Latest Updates -->
        <section id="view-home" class="tab-view active">
            <div id="loadingHome" class="loading">Loading updates...</div>
            <div id="errorHome" class="error" style="display: none;"></div>
            <div id="homeItemsList" class="list-container"></div>
        </section>

        <!-- CATEGORIES VIEW -->
        <section id="view-categories" class="tab-view" style="display: none;">
            <div id="loadingCategories" class="loading">Loading categories...</div>
            <div id="errorCategories" class="error" style="display: none;"></div>
            <div id="categoriesList" class="grid-container"></div>
        </section>

        <!-- SEARCH VIEW -->
        <section id="view-search" class="tab-view" style="display: none;">
            <div class="search-container large-search" style="position: relative;">
                <input type="text" id="searchInput" placeholder="Search..." autocomplete="off">
                <button id="searchBtn">Search</button>
                <div id="searchSuggestions" class="suggestions-dropdown" style="display: none;"></div>
            </div>
            <div class="search-results-section" id="searchResultsSection" style="display: none; margin-top: 20px;">
                <h3>Search Results</h3>
                <div id="searchResults" class="grid-container"></div>
            </div>
        </section>
    </main>

    <nav class="bottom-nav">
        <button class="nav-btn active" data-target="view-home">
            <span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
            <span class="nav-label">Home</span>
        </button>
        <button class="nav-btn" data-target="view-categories">
            <span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg></span>
            <span class="nav-label">Categories</span>
        </button>
        <button class="nav-btn" data-target="view-search">
            <span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
            <span class="nav-label">Search</span>
        </button>
    </nav>

    <script src="config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/tabs.js"></script>
    <script src="js/search.js"></script>
    <script src="js/categories.js"></script>
</body>
</html>
