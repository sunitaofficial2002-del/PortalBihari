<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Items - Bihar Portal</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="main-header">
        <div class="container" style="display: flex; align-items: center; position: relative; justify-content: center; height: 32px;">
            <a href="index.html?tab=categories" style="position: absolute; left: 15px; background: none; border: none; cursor: pointer; color: var(--ink); padding: 4px; align-items: center; justify-content: center; text-decoration: none; display: flex;">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </a>
            <span class="logo" id="headerCategoryName" style="pointer-events: none;">Category</span>
        </div>
    </header>

    <main class="container">

        <section class="search-results-section" id="searchResultsSection" style="display: none;">
            <h2>Search Results</h2>
            <div id="searchResults" class="grid-container"></div>
        </section>

        <section class="items-section" id="itemsSection">
            <div id="loadingItems" class="loading">Loading items...</div>
            <div id="errorItems" class="error" style="display: none;"></div>
            <div id="itemsList" class="list-container"></div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Bihar Portal. All rights reserved.</p>
        </div>
    </footer>

    <script src="config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/search.js"></script>
    <script src="js/items.js"></script>
</body>
</html>
